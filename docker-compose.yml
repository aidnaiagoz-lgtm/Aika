services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: automax
      POSTGRES_PASSWORD: automax_dev
      POSTGRES_DB: automax
    ports:
      - "5432:5432"
    volumes:
      - automax_pg_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"

volumes:
  automax_pg_data:
